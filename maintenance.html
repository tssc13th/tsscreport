<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' https://tssc13th.github.io data:;">

    <title>系統通知 - TSSC13TH 胡台校意見箱</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
            text-align: center;
        }

        .icon-box {
            width: 68px;
            height: 68px;
            background-color: #fef3c7;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 2rem;
            animation: redGlowBreathing 1.2s infinite ease-in-out;
        }

        @keyframes redGlowBreathing {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 22px 6px rgba(239, 68, 68, 0.85);
                transform: scale(1.05);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
                transform: scale(1);
            }
        }

        .title {
            font-size: 1.15rem;
            color: #334155;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .main-message {
            font-size: 1.35rem;
            color: #0f172a;
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .sub-message {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .time-text {
            font-size: 0.9rem;
            color: #d97706;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .footer-org {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #fef3c7;
            color: #b45309;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-box">
            ⚠️
        </div>

        <div class="title">系統通知</div>

        <div class="main-message">
            系統正在維護更新中
        </div>

        <div class="sub-message">
            維護期間將暫時停止意見投遞等功能，造成不便，敬請見諒
        </div>

       
        <div id="timeBox" class="time-text" style="display: none;">
            預計恢復使用時間：<span id="maintenanceTimeText"></span>
        </div>

        <div class="footer-org">
            胡志明市台灣學校學生會 TSSC13TH
        </div>

        <div>
            <div class="badge-status">
                 系統目前處於維護狀態
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzXm5TiQss1GUKkDF4TOZJMqAeraA63vrpecSEzAuIvcNOvGjF51HFWnNutWc1Mjx4f/exec';
        let maintenanceInterval = null;

        function checkUnlockStatus() {
            fetch(`${GAS_URL}?action=checkLockStatus&_t=${Date.now()}`)
                .then(res => {
                    if (!res.ok) throw new Error('HTTP 錯誤');
                    return res.json();
                })
                .then(data => {
                    if (data && typeof data.locked !== 'undefined') {
                        if (data.locked === false && data.maintenance === false) {
                            if (maintenanceInterval) clearInterval(maintenanceInterval);
                            window.location.href = 'index.html';
                            return;
                        }

                        const timeBox = document.getElementById('timeBox');
                        const timeText = document.getElementById('maintenanceTimeText');
                        if (data.maintenanceTime) {
                            timeText.innerText = data.maintenanceTime;
                            timeBox.style.display = 'block';
                        } else {
                            timeBox.style.display = 'none';
                        }
                    }
                })
                .catch(err => console.warn('維護狀態檢測連線波動，維持維護畫面:', err.message));
        }

        window.onload = function() {
            checkUnlockStatus();
            maintenanceInterval = setInterval(checkUnlockStatus, 10000);
        };
    </script>
</body>
</html>
